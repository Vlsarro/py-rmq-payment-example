services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_API_KEY: ${APP_API_KEY:-dev-secret-key}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-dev-webhook-secret}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped